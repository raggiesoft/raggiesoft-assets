server {
    server_name lore.raggiesoft.com;
    root /var/www/lore.raggiesoft.com;

    access_log /var/log/nginx/lore.raggiesoft_access.log;
    error_log /var/log/nginx/lore.raggiesoft_error.log;

    index index.html;

    # Block access to hidden files/directories
    location ~ /\. {
        deny all;
    }

    # Core routing for Next.js Static Export
    # Nginx must check for the raw URI, then the URI with .html (how Next.js exports routes)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Aggressive caching for static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Catch the Cloudflare HTTPS proxy traffic
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # The wildcard SSL certificates
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    listen 80;
    listen [::]:80;
    server_name lore.raggiesoft.com;

    # Force redirect to HTTPS
    if ($host = lore.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
