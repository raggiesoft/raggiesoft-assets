# ============================================================================
# Architectural Block: music.raggiesoft.com.conf
# ============================================================================
# Domain: music.raggiesoft.com (Engine Room Records)
# Platform: Progressive Web App (PWA) / SvelteKit 5 Single Page Application
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# Upstream CDN / DNS: Cloudflare (Proxied A Record with Full/Strict SSL)
#
# Key Architectural Responsibilities:
# 1. Static SPA Routing: Directs traffic to `/var/www/raggiesoft-music/build`.
#    Uses `try_files $uri $uri/ /index.html` to support deep linking and browser history.
# 2. PWA Lifecycle Optimization:
#    - `sw.js` (Service Worker): Strictly served with `no-cache, no-store, must-revalidate`
#      so browsers detect and activate worker updates immediately.
#    - `manifest.json`: Cached with short TTL for rapid app icon/metadata rotation.
# 3. High-Velocity Static Asset Caching:
#    - `/_app/**`: Static hashed chunks are cached immutably for 1 year.
# 4. Security & SSL:
#    - Wildcard origin certificates (`/etc/nginx/ssl/raggiesoft.pem`).
#    - Strict TLS 1.2/1.3 cipher suite matching Cloudflare Origin CA guidelines.
#    - Enforces HTTP -> HTTPS redirect on port 80.
#
# Deployment Instructions on DigitalOcean:
# 1. SSH into the Droplet: `ssh root@142.93.244.239`
# 2. Clone/Pull Repo: `cd /var/www && git clone https://github.com/raggiesoft/raggiesoft-music.git`
#    (or `cd /var/www/raggiesoft-music && git pull origin main`)
# 3. Build Static PWA: `cd /var/www/raggiesoft-music && npm install && npm run build`
# 4. Link Nginx Config:
#    `ln -s /var/www/raggiesoft-assets/_workspace/nginx-config/music.raggiesoft.com.conf /etc/nginx/sites-available/music.raggiesoft.com.conf`
#    `ln -s /etc/nginx/sites-available/music.raggiesoft.com.conf /etc/nginx/sites-enabled/`
# 5. Test & Reload Nginx: `nginx -t && systemctl reload nginx`
# ============================================================================

server {
    server_name music.raggiesoft.com;
    root /var/www/raggiesoft-music/build;

    access_log /var/log/nginx/music.raggiesoft_access.log;
    error_log /var/log/nginx/music.raggiesoft_error.log;

    index index.html;

    # Deny access to hidden system and version control files
    location ~ /\. {
        deny all;
    }

    # 1. Core Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Progressive Web App: Service Worker (Never cache to ensure instant client updates)
    location = /sw.js {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 3. Progressive Web App: Web App Manifest
    location = /manifest.json {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    # 4. SvelteKit Immutable Build Artifacts (Content-hashed JS, CSS)
    location ^~ /_app/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. General Static Media & Icons
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|eot|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------------------------
    # SSL Configuration (Cloudflare Origin CA Proxy)
    # ------------------------------------------------------------------------
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# HTTP to HTTPS Insecure Traffic Redirection
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name music.raggiesoft.com;

    if ($host = music.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
