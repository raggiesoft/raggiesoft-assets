<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!--
    ============================================================================
    RaggieSoft Story Crossroads — Official Imprint Seal (3-Directional Variant)
    ============================================================================
    Purpose:
      Official publishing imprint medallion for interactive RaggieSoft Story
      Crossroads novels, designed as a sibling crest to Ocean View Archives
      (oceanview-archives.svg) and stamped onto both 2:3 portrait covers and
      16:9 OpenGraph widescreen covers.
  -->
  <defs>
    <path id="top-curve" d="M 86 250 a 164 164 0 0 1 328 0" fill="transparent" />
    <path id="bottom-curve" d="M 61 250 a 189 189 0 0 0 378 0" fill="transparent" />
  </defs>

  <circle cx="250" cy="250" r="230" fill="#0F4C5C" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#E3B27C" stroke-width="4.5" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="#E3B27C" stroke-width="2.8" />

  <!-- Equator Four-Point Star Separators -->
  <path d="M 72.5 238 L 75.5 247 L 84.5 250 L 75.5 253 L 72.5 262 L 69.5 253 L 60.5 250 L 69.5 247 Z" fill="#E3B27C" />
  <path d="M 427.5 238 L 430.5 247 L 439.5 250 L 430.5 253 L 427.5 262 L 424.5 253 L 415.5 250 L 424.5 247 Z" fill="#E3B27C" />

  <text fill="#E3B27C" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" letter-spacing="5">
    <textPath href="#top-curve" startOffset="50%" text-anchor="middle">RAGGIESOFT</textPath>
  </text>
  <text fill="#E3B27C" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="29" font-weight="bold" letter-spacing="2.8">
    <textPath href="#bottom-curve" startOffset="50%" text-anchor="middle">STORY CROSSROADS</textPath>
  </text>

  <!-- Subtle Crossroads Diagonal Compass Rays (echoing Ocean View Archives) -->
  <g stroke="#E3B27C" stroke-width="2.6" opacity="0.35" stroke-linecap="round">
    <line x1="184" y1="184" x2="316" y2="316" />
    <line x1="184" y1="316" x2="316" y2="184" />
  </g>

  <!-- Signature Four-Point RaggieSoft Star Above Post Cap (echoing Concept 1) -->
  <path d="M 250 130 L 254.8 145.2 L 270 150 L 254.8 154.8 L 250 170 L 245.2 154.8 L 230 150 L 245.2 145.2 Z" fill="#E3B27C" />

  <!-- Central Signpost Column with Pyramidal Finial Cap & Pedestal -->
  <path d="M 250 176 L 258 186 L 258 334 L 242 334 L 242 186 Z" fill="#E3B27C" />
  <rect x="228" y="330" width="44" height="8" rx="4" fill="#E3B27C" />

  <!-- Diverging 3-Way Path Arcs (Left, Center, Right) Below Pedestal -->
  <g fill="none" stroke="#E3B27C" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <path d="M 242 338 Q 224 353 192 357" />
    <line x1="250" y1="338" x2="250" y2="362" />
    <path d="M 258 338 Q 276 353 308 357" />
  </g>

  <!-- Board 1: Top Upper-Left Signboard -->
  <g transform="rotate(6 250 208)">
    <path d="M 270 193 L 174 193 L 150 208 L 174 223 L 270 223 Z" fill="#E3B27C" stroke="#0F4C5C" stroke-width="4" stroke-linejoin="round" />
    <rect x="178" y="206" width="74" height="4" rx="2" fill="#0F4C5C" />
  </g>

  <!-- Board 2: Middle Right Signboard -->
  <g transform="rotate(-2 250 250)">
    <path d="M 230 235 L 328 235 L 352 250 L 328 265 L 230 265 Z" fill="#E3B27C" stroke="#0F4C5C" stroke-width="4" stroke-linejoin="round" />
    <rect x="248" y="248" width="74" height="4" rx="2" fill="#0F4C5C" />
  </g>

  <!-- Board 3: Bottom Lower-Left Signboard -->
  <g transform="rotate(-6 250 292)">
    <path d="M 268 277 L 180 277 L 156 292 L 180 307 L 268 307 Z" fill="#E3B27C" stroke="#0F4C5C" stroke-width="4" stroke-linejoin="round" />
    <rect x="184" y="290" width="66" height="4" rx="2" fill="#0F4C5C" />
  </g>
</svg>
