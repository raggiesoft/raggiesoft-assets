<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="raggiesoftStudioLogoTitle">
  <title id="raggiesoftStudioLogoTitle">RaggieSoft Studio</title>
  <!-- Deep Midnight-Navy Workstation Tile with Warm Gold Frame -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#0b132b" stroke="#fbbf24" stroke-width="3"/>
  <!-- Official #005AEB RaggieSoft Brand Blue Workstation Titlebar -->
  <rect x="8" y="8" width="48" height="9" rx="2.5" fill="#005aeb"/>
  <circle cx="13.5" cy="12.5" r="1.8" fill="#fbbf24"/>
  <circle cx="19" cy="12.5" r="1.8" fill="#ffffff"/>
  <!-- 8-Tool Studio Jewel Spectrum Ribbon -->
  <rect x="8"  y="19" width="6" height="2.5" fill="#005aeb"/>
  <rect x="14" y="19" width="6" height="2.5" fill="#047857"/>
  <rect x="20" y="19" width="6" height="2.5" fill="#6d28d9"/>
  <rect x="26" y="19" width="6" height="2.5" fill="#b45309"/>
  <rect x="32" y="19" width="6" height="2.5" fill="#be123c"/>
  <rect x="38" y="19" width="6" height="2.5" fill="#4338ca"/>
  <rect x="44" y="19" width="6" height="2.5" fill="#0369a1"/>
  <rect x="50" y="19" width="6" height="2.5" fill="#0f766e"/>
  <!-- 3-Facet Isometric Modular Studio Cube (Top Lid + Left Spine + Right Cover) -->
  <polygon points="32,24.5 46.5,32 32,39.5 17.5,32" fill="#60a5fa"/>
  <polygon points="16.5,34 30.8,41.4 30.8,55.2 16.5,47.8" fill="#005aeb"/>
  <polygon points="47.5,34 47.5,47.8 33.2,55.2 33.2,41.4" fill="#1e40af"/>
  <!-- Golden Isometric Precision Keystone Core -->
  <polygon points="32,29 37.5,32 32,35 26.5,32" fill="#fbbf24"/>
</svg>
